[project]
name = "claude-delegate-local-mcp"
version = "0.0.0"
description = "MCP server that delegates Claude Code work to self-hosted local models over an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ComputerSaysNull" }]
dependencies = [
    # Pinned below 4.0 deliberately: 3.4.7 is current stable and 4.0.0 is already
    # in beta. An unpinned major bump can change tool registration under us.
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
claude-delegate-local-mcp = "claude_delegate_local.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Parallelism, now on by default in addopts below rather than opt-in. It is also a
    # check in its own right: it fails on any test that mutates shared state, which is how
    # the agent-roster one was found.
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_delegate_local"]

[tool.pytest.ini_options]
# Parallel by default. This was opt-in until 2026-08-31, on the reasoning that a plain
# `pytest` should read normally and the speed was there when wanted -- and the speed then
# went unwanted for a whole session, at 488s serial against 183s with workers, because
# remembering a flag is not a default. Anything that relies on being remembered is not a
# rule. The readable serial run is still one flag away: `-n 0`.
#
# `--maxprocesses` because `auto` is a core count and leaves nothing for the controller or
# the OS. The figures in the paragraph above had gone stale by a few hundred tests: measured
# 2026-09-07 on 12 logical cores, serial is 416s rather than 488s. Ten workers run the
# Windows suite in 140s against 238s at six, and the WSL suite in 110s against 246s.
#
# Set for scheduling margin, not for memory. The suite's own footprint is about 1 GB of
# commit and barely moves between six and ten workers, because the peak process count is
# dominated by the interpreters the sandbox and pty tests spawn -- 24 either way -- rather
# than by the workers. Memory pressure on a full run comes from whatever else is resident.
#
# A cap rather than a count, deliberately: it binds only where `auto` would exceed it, so a
# smaller machine is unaffected and no core count is baked in here.
addopts = ["-n", "auto", "--maxprocesses", "10"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs the live cluster or a real bwrap; skipped by default",
]

# Tests that cannot run nested, i.e. inside the sandbox a delegation's `run_bash` gets.
# Read at call time and applied as PYTEST_ADDOPTS, so the model does not have to remember
# them -- forgetting produces a real non-zero exit from a test that cannot pass, which is
# a false failure that looks exactly as trustworthy as a true one.
#
# Every entry is here for one reason: `--unshare-all` denies the network, and re-sharing it
# would hand every sandboxed command the whole host namespace with no allowlist (ADR-0063).
# A named exclusion is one line an operator can read; a shared namespace is a capability
# nobody re-reads.
#
# The first asserts the network is reachable, so it cannot pass where it is denied. The rest
# were found by actually running this suite nested on 2026-09-09, once the denylist stopped
# covering its own list file: four talk to the live endpoint, and one runs a real `pip
# install` to build a virtualenv. They pass on the host, where the cluster is up, which is
# why nothing had noticed. Note that `integration` is documented as "skipped by default" and
# is not -- `addopts` carries no `-m` filter, so these run unless deselected.
[tool.delegate-local]
nested-deselect = [
    "tests/test_sandbox.py::test_network_is_reachable_by_address_when_shared",
    "tests/test_backends_openai_compat.py::test_probe_against_the_live_endpoint",
    "tests/test_backends_openai_compat.py::test_one_real_completion_against_the_live_endpoint",
    "tests/regression/test_reasoning_exhaustion_recovers.py::test_the_live_empty_answer_is_recovered_by_the_budget_retry",
    "tests/regression/test_reasoning_exhaustion_recovers.py::test_the_live_verdict_is_exhaustion_only_after_the_step_down_was_tried",
    "tests/test_provision.py::test_a_real_build_leaves_a_usable_interpreter_and_a_record",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# The rule set is written out rather than inherited. Ruff's default selection widens
# between releases: with no `select` and an unbounded `ruff>=0.6`, this repository went
# from 3 findings to 45 without a line of it changing. A lint set that moves on its own
# fails a build nobody broke, so it is pinned here and the dependency is bounded.
[tool.ruff.lint]
select = ["E", "F", "B", "UP", "ISC", "PL", "RUF", "FURB"]

# Each ignore is a decision with a reason, not a way to reach zero. A blanket suppression
# would make the whole set advisory again, which is the state this is replacing.
ignore = [
    # Comparing against a literal is the clearest form for an HTTP status range and for a
    # test's expected value. Naming `200` HTTP_OK_MIN moves the number without explaining it.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# These tests run a subprocess *expecting* it to fail and assert on the exit code
# themselves. check=True would break them; check=False on every call is noise that hides
# the two places in scripts/ where the argument is a real decision.
"tests/**" = ["PLW1510", "PLC0415"]
# The gate's check functions branch once per rule they enforce. Splitting them to satisfy
# a branch count would scatter one policy across several functions, which is the opposite
# of what this file is for.
"scripts/docs_gate.py" = ["PLR0912"]
