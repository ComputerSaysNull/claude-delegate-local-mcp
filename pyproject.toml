[project]
name = "claude-delegate-local-mcp"
version = "0.0.0"
description = "MCP server that delegates Claude Code work to self-hosted local models over an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ComputerSaysNull" }]
dependencies = [
    # Pinned below 4.0 deliberately: 3.4.7 is current stable and 4.0.0 is already
    # in beta. An unpinned major bump can change tool registration under us.
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
claude-delegate-local-mcp = "claude_delegate_local.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_delegate_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs the live cluster or a real bwrap; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# The rule set is written out rather than inherited. Ruff's default selection widens
# between releases: with no `select` and an unbounded `ruff>=0.6`, this repository went
# from 3 findings to 45 without a line of it changing. A lint set that moves on its own
# fails a build nobody broke, so it is pinned here and the dependency is bounded.
[tool.ruff.lint]
select = ["E", "F", "B", "UP", "ISC", "PL", "RUF", "FURB"]

# Each ignore is a decision with a reason, not a way to reach zero. A blanket suppression
# would make the whole set advisory again, which is the state this is replacing.
ignore = [
    # Comparing against a literal is the clearest form for an HTTP status range and for a
    # test's expected value. Naming `200` HTTP_OK_MIN moves the number without explaining it.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# These tests run a subprocess *expecting* it to fail and assert on the exit code
# themselves. check=True would break them; check=False on every call is noise that hides
# the two places in scripts/ where the argument is a real decision.
"tests/**" = ["PLW1510", "PLC0415"]
# The gate's check functions branch once per rule they enforce. Splitting them to satisfy
# a branch count would scatter one policy across several functions, which is the opposite
# of what this file is for.
"scripts/docs_gate.py" = ["PLR0912"]
