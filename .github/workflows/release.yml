name: release

# A release is a `v<version>` tag on main, and nothing else publishes one (ADR-0115). It goes
# to GitHub Releases only: the wheel, and the transcript schema a reader elsewhere pins to.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # creating the release is the one write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Before anything is built: a tag naming another version would publish a package
      # whose version is not its own name.
      - name: Check the tag names the package version
        run: python scripts/release_check.py "$GITHUB_REF_NAME"

      # The pinned build backend, as CI installs it, rather than whatever isolation fetches.
      - name: Build the wheel
        run: |
          python -m pip install -c .github/ci-constraints.txt hatchling
          python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl src/claude_delegate_local/transcript.schema.json
          --title "$GITHUB_REF_NAME"
          --notes "What changed and why is in CHANGELOG.md, by pull request number."
