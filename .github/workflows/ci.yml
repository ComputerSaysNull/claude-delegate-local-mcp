name: ci

# The gate runs here as well as in the pre-commit hook, from the same script. The hook is
# fast feedback; this is the authority that `--no-verify` cannot walk past.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: docs and secrets gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The commit-authorship check walks a range, so it needs real history. A
          # shallow clone would check nothing and still report success.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Host literals are never committed -- a file listing what must not be committed is
      # itself the leak -- so CI reads them from a repository secret. Without the secret
      # the gate still runs its committed patterns and says which mode it used.
      - name: Materialise local forbidden strings
        env:
          FORBIDDEN: ${{ secrets.FORBIDDEN_STRINGS }}
        # Guarded inside the script, not with a step-level `if`: a step's own `env` block
        # is not available to its own `if` expression, so that form would have tested an
        # always-empty value and silently never run. Another check that reports success
        # while doing nothing.
        run: |
          if [ -n "$FORBIDDEN" ]; then
            echo "$FORBIDDEN" > security/forbidden_strings.txt
            echo "forbidden strings loaded from repository secret"
          else
            echo "no FORBIDDEN_STRINGS secret set; committed patterns only"
          fi

      # No dependencies installed, deliberately: the gate uses only the standard library,
      # so a broken install cannot disable it. That is also why the ownership manifest is
      # TOML -- tomllib is stdlib, PyYAML is not.
      # GITHUB_EVENT_PATH carries the pull request title and body, which are a
      # public surface written outside git -- no hook or file check can see them.
      - name: Run the gate
        run: python scripts/docs_gate.py --mode ci --diff origin/${{ github.base_ref || 'main' }}...HEAD --pr-event "$GITHUB_EVENT_PATH"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # ruff is pinned in pyproject.toml, and the rule set is written out there rather
      # than inherited. Both matter: with an unbounded version and no `select`, this
      # repository went from 3 findings to 45 across ruff releases without a line of it
      # changing. A lint job on a moving rule set fails builds nobody broke.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src scripts tests

      # A step of this job rather than a job of its own: the branch ruleset names required
      # checks by job name, and a new name would block every pull request until edited.
      - name: Mypy
        run: mypy

  tests:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      # Six is this project's standing concurrency rule -- what the serving stack admits
      # at once -- applied wherever it can be machine-enforced rather than merely written down.
      max-parallel: 6
      fail-fast: false
      # Floor and ceiling, not floor and floor+1. 3.12 is what the server runs on --
      # Ubuntu 24.04's system interpreter, in WSL2 -- and 3.14 is what development
      # happens on, so between them every interpreter anyone here actually uses is
      # covered. Testing 3.12 and 3.13 would have bought a second reading of a version
      # nobody runs while leaving the newest untested. 3.11 was dropped with the floor:
      # nothing needed it, and it was only ever the floor because the project started
      # there.
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      # What the sandbox tests need to *import*, not to run. Measured on this runner
      # 2026-08-29: bwrap creates the user namespace fine, then fails to bring up
      # loopback inside the new network namespace -- "Failed RTM_NEWADDR: Operation not
      # permitted", no CAP_NET_ADMIN. So the sandbox tests stay `integration`-marked and
      # this install does not, by itself, let them be enabled here. See JOURNAL.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Integration tests need the private cluster, which CI cannot reach. Excluded by
      # marker so the exclusion is explicit rather than a silently absent test.
      #
      # `--durations` because this job is the one place the suite is timed on hardware
      # nobody can inspect afterwards. A tail that grew is otherwise a wall-clock number
      # with nothing behind it, which is how a 2x slowdown went four weeks unexplained
      # (#275): the cause was a ten-second wait, and one duration would have named it.
      - name: Run tests
        run: python -m pytest -q -m "not integration" --durations=25

      # A stale generated document fails the build, not merely the hook.
      - name: Verify generated documents are current
        run: |
          python scripts/gen_config_docs.py --check

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0 # scan history, not just the tip

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
